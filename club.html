<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Campus Club Membership"</title>
</head>
<style>
    body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding-bottom: 50px;
        }
    .topnav
    {
        background-color: #333;
        position: sticky;
        top: 0;
        overflow: hidden;
    }
    .topnav a 
    {
        float: left;
        padding: 14px 16px;
        color: white;
        text-decoration: none;
    }
    .topnav a:hover 
    {
        background: #ddd;
        color: black;
    }
    h1 
    {
        text-align: center;
        color: navy;
    }
   
    .card 
    {
        width: 400px;
        max-width: calc(100% - 64px);
        margin: 20px auto;
        padding: 15px;
        border: 2px solid #777;
        border-radius: 10px;
        background: white;
        box-shadow: 4px 4px 8px gray;
        position: relative;
    }

        .card > h2 
        {
            color: green;
            margin-top: 0;
        }

        .card p {
            font-style: italic;
        }

        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: red;
            color: white;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 12px;

        }

            form {
            width: 400px;
            margin: 20px auto;
            box-sizing: border-box;
        }

        fieldset {
            border: 1px solid #bbb;
            border-radius: 6px;
            padding: 15px 20px 20px;
            background-color: #ffffff;
        }

        legend {
            font-weight: bold;
            padding: 0 6px;
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="number"],
        .form-group select,
        .form-group textarea {
            padding: 6px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
        }

        .radio-group,
        .checkbox-group {
            margin-bottom: 12px;
            font-size: 13px;
        }

        .radio-group label,
        .checkbox-group label {
            margin-right: 10px;
            font-weight: normal;
        }

        button[type="submit"] {
            margin-top: 8px;
            padding: 7px 16px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 3px;
            background-color: #efefef;
        }

        button[type="submit"]:hover {
            background-color: #e0e0e0;
        }

</style>
<body>
    <div class ="topnav">
        <a href="home.html">Home</a>
        <a href="events.html">Events</a>
        <a href="join.html">Join</a>
        <br/>
        <br/>


        <div class="main-content">
    
        <h1>Programming Club</h1>

        

        <div class="card" id="home">
        <span class="badge">NEW</span>
        <h2>Club Membership</h2>
        <p>
            Join the Programming Club to take part in contests,
            workshops and weekly meetups.
        </p>
    </div>


    </div>
    <form action="" method="post">
            <fieldset>
                <legend>Join the Club</legend>

                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" minlength="3" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="studentid">Student ID:</label>
                    <input type="text" id="studentid" name="studentid" placeholder="24-56789-1" pattern="[0-9]{2}-[0-9]{5}-[0-9]" required>
                </div>

                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" min="17" max="40" required>
                </div>

                <div class="radio-group">
                    <label><strong>Membership Type:</strong></label>
                    <input type="radio" id="mem_general" name="membership_type" value="General" required>
                    <label for="mem_general">General</label>

                    <input type="radio" id="mem_executive" name="membership_type" value="Executive" required>
                    <label for="mem_executive">Executive</label>
                </div>

                <div class="form-group">
                    <label for="preferred_club">Preferred Club:</label>
                    <select id="preferred_club" name="preferred_club" required>
                        <option value="">Select a club</option>
                        <option value="Programming">Programming</option>
                        <option value="Robotics">Robotics</option>
                        <option value="Debate">Debate</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="why_join">Why do you want to join?</label>
                    <textarea id="why_join" name="why_join" rows="4" maxlength="200" required></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rules_agree" name="rules_agree" required>
                    <label for="rules_agree">I agree to the club rules</label>
                </div>

                <button type="submit">Join Now</button>
            </fieldset>
        </form>
    </div>
    
</body>
</html>
